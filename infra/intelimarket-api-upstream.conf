# Deploy sin corte: 2 instancias de la API. nginx reintenta en la otra si
# una esta reiniciando. max_fails=0 A PROPOSITO: con max_fails>0 un par de
# fallos durante el restart de UNA instancia la deja "marcada como caida"
# por fail_timeout segundos incluso despues de volver sana — si el deploy
# toca la otra dentro de esa ventana nginx cree que las 2 estan caidas y
# devuelve 502 aunque siempre hubo una respondiendo (confirmado en superextra
# 23-sep: 2 requests en 502 por este efecto).
upstream intelimarket_api_pool {
    server 127.0.0.1:8000 max_fails=0;
    server 127.0.0.1:8010 max_fails=0;
}
