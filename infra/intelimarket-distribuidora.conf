# InteliMarket Distribuidora — nginx server block (LAN / Tailscale, sin TLS)
# Puerto 5173: mismo que supermercado para que los scripts sean compatibles.
server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /var/www/intelimarket-ui/current;
    index index.html;

    # sw.js sin cache para que el PWA tome actualizaciones inmediatamente
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets hasheados: cache agresivo, nunca cambian de URL
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location /download/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location /static/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
