# InteliMarket Distribuidora — server block internet (via Cloudflare)
# Escucha en :80; Cloudflare termina TLS del lado del cliente.
# Para Full/Strict SSL: reemplazar listen 80 por listen 443 ssl
# y agregar ssl_certificate / ssl_certificate_key con el Cloudflare Origin Cert.
#
# Instalación:
#   cp infra/intelimarket-gonzalito-internet.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/intelimarket-gonzalito-internet.conf \
#           /etc/nginx/sites-enabled/
#   cp infra/gonzalito-cloudflare.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name intelimarket.gonzalito.com.py;

    # --- Real IP de Cloudflare ---
    # Sin esto, $remote_addr es siempre un IP de CF y el rate-limit
    # se aplica por relay, no por cliente real.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Rechazar acceso directo al IP del servidor (bypasear Cloudflare)
    if ($is_cloudflare = 0) {
        return 444;
    }

    root /var/www/intelimarket-ui/current;
    index index.html;

    # --- Documentación API: solo LAN / Tailscale ---
    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- API con rate-limit ---
    location /api/ {
        limit_req zone=gonzalito_api burst=60 nodelay;
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location /download/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location /static/ {
        proxy_pass http://intelimarket_api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
