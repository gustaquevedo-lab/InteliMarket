name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      # El contexto `secrets` NO se puede usar directamente en un `if:` de
      # step: GitHub invalida el workflow completo y registra una corrida
      # fallida ("No jobs were run") en cada push a cualquier rama. Se pasa
      # por una variable de entorno del job, donde si esta permitido.
      HAS_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Frontend
        working-directory: ui-web
        run: |
          npm ci
          npm run build

      - name: Set Docker tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=staging-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intelimarket-api:${{ steps.vars.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/intelimarket-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI
        uses: docker/build-push-action@v5
        with:
          context: ./ui-web
          file: ./ui-web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intelimarket-ui:${{ steps.vars.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/intelimarket-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        if: ${{ env.HAS_DEPLOY_HOST == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/intelimarket
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
