name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test-backend:
    name: Backend — Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intimarket
          POSTGRES_USER: intimarket
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "api[dev]"

      - name: Test with pytest
        run: python -m pytest api/tests/ -v --cov=api/src --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://intimarket:password@localhost:5432/intimarket
          REDIS_URL: redis://localhost:6379/1

  build-frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ui-web

      - name: Lint
        run: npm run lint
        working-directory: ui-web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ui-web

      - name: Build
        run: npm run build
        working-directory: ui-web

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: intimarket/api:latest

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ui-web
          push: false
          tags: intimarket/ui-web:latest
