<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#amberGrad)" stroke-width="6" opacity="0.4" />

  <!-- Efecto de luz central -->
  <circle cx="256" cy="256" r="160" fill="#F59E0B" opacity="0.08" filter="url(#glow)" />

  <!-- Camión de Reparto y Muelle -->
  <g transform="translate(64, 96)">
    <!-- Cabina y Caja del Camión -->
    <path d="M 40 180 L 40 60 C 40 46 52 34 66 34 L 220 34 C 234 34 246 46 246 60 L 246 180 Z" fill="#1E293B" stroke="#334155" stroke-width="8" />
    
    <!-- Líneas de contenedor / persiana de muelle -->
    <line x1="60" y1="70" x2="226" y2="70" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="105" x2="226" y2="105" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="140" x2="226" y2="140" stroke="#475569" stroke-width="6" stroke-linecap="round" />

    <!-- Cabina del conductor -->
    <path d="M 246 80 L 300 80 C 314 80 326 90 332 102 L 354 140 C 358 148 360 156 360 165 L 360 180 L 246 180 Z" fill="url(#amberGrad)" />
    <!-- Ventana cabina -->
    <path d="M 258 96 L 296 96 C 302 96 308 100 312 106 L 328 134 L 258 134 Z" fill="#0F172A" opacity="0.85" />

    <!-- Paragolpes y chasis -->
    <rect x="24" y="180" width="350" height="24" rx="10" fill="#334155" />

    <!-- Ruedas -->
    <circle cx="100" cy="204" r="38" fill="#090D16" stroke="#475569" stroke-width="8" />
    <circle cx="100" cy="204" r="16" fill="url(#amberGrad)" />

    <circle cx="290" cy="204" r="38" fill="#090D16" stroke="#475569" stroke-width="8" />
    <circle cx="290" cy="204" r="16" fill="url(#amberGrad)" />

    <!-- Haz de luz escáner láser de código de barras -->
    <polygon points="120,40 180,40 240,160 60,160" fill="url(#cyanGrad)" opacity="0.25" />
    <line x1="40" y1="105" x2="246" y2="105" stroke="#38BDF8" stroke-width="5" stroke-dasharray="12,8" filter="url(#glow)" />
  </g>

  <!-- Badge EXTRA Supermercado en la base -->
  <g transform="translate(136, 380)">
    <rect width="240" height="54" rx="27" fill="url(#amberGrad)" />
    <text x="120" y="35" fill="#090D16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="3">
      EXTRA DEPÓSITO
    </text>
  </g>
</svg>
