<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00358e" />
      <stop offset="45%" stop-color="#002665" />
      <stop offset="85%" stop-color="#060f22" />
      <stop offset="100%" stop-color="#020611" />
    </radialGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="35%" stop-color="#FF6305" />
      <stop offset="100%" stop-color="#C84800" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Fondo squircle premium -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#orangeGrad)" stroke-width="5" opacity="0.45" />

  <!-- Luz ambiental central -->
  <circle cx="256" cy="220" r="140" fill="#FF6305" opacity="0.12" filter="url(#laserGlow)" />

  <!-- Camión y Pallet de Recepción -->
  <g transform="translate(68, 88)" filter="url(#dropShadow)">
    <!-- Cabina y Caja de Carga -->
    <path d="M 30 180 L 30 52 C 30 40 40 30 52 30 L 225 30 C 237 30 247 40 247 52 L 247 180 Z" fill="url(#metalPlate)" stroke="#475569" stroke-width="6" />

    <!-- Persiana de Muelle / Paneles del Contenedor -->
    <line x1="48" y1="62" x2="229" y2="62" stroke="#64748B" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="94" x2="229" y2="94" stroke="#64748B" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="126" x2="229" y2="126" stroke="#64748B" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="158" x2="229" y2="158" stroke="#64748B" stroke-width="5" stroke-linecap="round" />

    <!-- Cabina aerodinámica Extra Orange -->
    <path d="M 247 72 L 305 72 C 318 72 330 82 336 94 L 358 138 C 362 146 364 155 364 164 L 364 180 L 247 180 Z" fill="url(#orangeGrad)" />
    <!-- Ventana cabina con tinte azul oscuro -->
    <path d="M 258 88 L 300 88 C 306 88 312 92 316 98 L 334 132 L 258 132 Z" fill="#060F22" opacity="0.9" />

    <!-- Paragolpes y chasis -->
    <rect x="18" y="180" width="354" height="26" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3" />

    <!-- Ruedas reforzadas -->
    <circle cx="95" cy="206" r="36" fill="#090D16" stroke="#64748B" stroke-width="8" />
    <circle cx="95" cy="206" r="14" fill="url(#orangeGrad)" />

    <circle cx="295" cy="206" r="36" fill="#090D16" stroke="#64748B" stroke-width="8" />
    <circle cx="295" cy="206" r="14" fill="url(#orangeGrad)" />

    <!-- Haz de escáner láser de recepción -->
    <polygon points="110,32 170,32 230,165 50,165" fill="url(#cyanLaser)" />
    <line x1="30" y1="108" x2="247" y2="108" stroke="#38BDF8" stroke-width="6" stroke-dasharray="14,8" filter="url(#laserGlow)" />
  </g>

  <!-- Badge EXTRA DEPÓSITO -->
  <g transform="translate(96, 388)">
    <rect width="320" height="58" rx="29" fill="url(#orangeGrad)" filter="url(#dropShadow)" />
    <rect width="316" height="54" x="2" y="2" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />
    <text x="160" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="3.5">
      EXTRA DEPÓSITO
    </text>
  </g>
</svg>