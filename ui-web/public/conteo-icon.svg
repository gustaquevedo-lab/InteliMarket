<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradCnt" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00358e" />
      <stop offset="45%" stop-color="#002665" />
      <stop offset="85%" stop-color="#060f22" />
      <stop offset="100%" stop-color="#020611" />
    </radialGradient>
    <linearGradient id="cyanGradCnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="orangeCnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="40%" stop-color="#FF6305" />
      <stop offset="100%" stop-color="#C84800" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070E1E" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadowCnt" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Fondo squircle premium -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradCnt)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#cyanGradCnt)" stroke-width="5" opacity="0.45" />

  <!-- Luz ambiental cian inventario -->
  <circle cx="256" cy="210" r="140" fill="#06B6D4" opacity="0.14" filter="url(#cyanGlow)" />

  <!-- Icono Central: Tabla Clipboard de Auditoría + Escáner + Control de Vencimiento -->
  <g transform="translate(136, 70)" filter="url(#dropShadowCnt)">
    <!-- Cuerpo de la Tabla Portapapeles (Clipboard) -->
    <rect x="20" y="35" width="200" height="235" rx="20" fill="url(#boardGrad)" stroke="#475569" stroke-width="6" />

    <!-- Clip superior metálico / dorado -->
    <rect x="75" y="18" width="90" height="30" rx="8" fill="url(#orangeCnt)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="120" cy="33" r="6" fill="#002665" />

    <!-- Líneas de Ítems Contados con Checkmarks -->
    <!-- Ítem 1 -->
    <g transform="translate(42, 75)">
      <circle cx="12" cy="12" r="11" fill="#10B981" />
      <path d="M 7 12 L 11 16 L 18 8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="34" y="6" width="105" height="12" rx="4" fill="#94A3B8" opacity="0.9" />
    </g>

    <!-- Ítem 2 -->
    <g transform="translate(42, 115)">
      <circle cx="12" cy="12" r="11" fill="#10B981" />
      <path d="M 7 12 L 11 16 L 18 8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="34" y="6" width="85" height="12" rx="4" fill="#94A3B8" opacity="0.9" />
    </g>

    <!-- Ítem 3 (Código de barras escaneado) -->
    <g transform="translate(42, 155)">
      <circle cx="12" cy="12" r="11" fill="url(#cyanGradCnt)" />
      <path d="M 7 12 L 11 16 L 18 8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Barras de código -->
      <line x1="36" y1="4" x2="36" y2="20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="4" x2="44" y2="20" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="50" y1="4" x2="50" y2="20" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
      <line x1="60" y1="4" x2="60" y2="20" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="68" y1="4" x2="68" y2="20" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
      <line x1="80" y1="4" x2="80" y2="20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="90" y1="4" x2="90" y2="20" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Rayo Láser de Lectura Horizontal -->
    <line x1="15" y1="167" x2="225" y2="167" stroke="#38BDF8" stroke-width="4" stroke-dasharray="10,6" filter="url(#cyanGlow)" />

    <!-- Medallón de Fecha de Vencimiento / Reloj Reloj de Auditoría (Esquina inferior derecha) -->
    <g transform="translate(150, 185)" filter="url(#dropShadowCnt)">
      <circle cx="45" cy="45" r="38" fill="#0A192F" stroke="url(#orangeCnt)" stroke-width="6" />
      <!-- Carátula de reloj / calendario -->
      <circle cx="45" cy="45" r="30" fill="url(#cyanGradCnt)" opacity="0.2" />
      <!-- Agujas del reloj -->
      <line x1="45" y1="45" x2="45" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <line x1="45" y1="45" x2="60" y2="45" stroke="url(#orangeCnt)" stroke-width="4" stroke-linecap="round" />
      <circle cx="45" cy="45" r="5" fill="#FFFFFF" />
      <!-- Marca de alerta vencimiento -->
      <circle cx="68" cy="24" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>

  <!-- Badge EXTRA CONTEO -->
  <g transform="translate(100, 388)">
    <rect width="312" height="58" rx="29" fill="url(#orangeCnt)" filter="url(#dropShadowCnt)" />
    <rect width="308" height="54" x="2" y="2" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />
    <text x="156" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="3.5">
      EXTRA CONTEO
    </text>
  </g>
</svg>