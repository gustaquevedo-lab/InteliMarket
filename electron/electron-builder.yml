appId: py.intelimarket.pos
productName: InteliMarket POS
copyright: IntelliHouse Soluciones

directories:
  output: ../dist-electron
  buildResources: ../electron/assets

files:
  - package.json
  - from: ../ui-web-dist
    to: .
  - from: ../electron
    to: electron
    filter:
      - "main.cjs"
      - "preload.cjs"
      - "pos-config.json"

win:
  target:
    - dir
  icon: ../electron/assets/icon.ico
  signAndEditExecutable: false

extraMetadata:
  main: electron/main.cjs
