<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="favGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fondo oscuro rounded -->
  <rect width="512" height="512" rx="128" fill="#0c141e" />

  <!-- Punto de la 'i' -->
  <circle cx="165" cy="110" r="34" fill="url(#favGreenGrad)" />

  <!-- Barra vertical izquierda (tallo de 'i' / trasera carrito) -->
  <rect x="138" y="172" width="54" height="160" rx="27" fill="url(#favBlueGrad)" />

  <!-- Barra vertical central (centro 'M') -->
  <rect x="229" y="212" width="54" height="120" rx="27" fill="url(#favBlueGrad)" />

  <!-- Barra vertical derecha (frente carrito) -->
  <rect x="320" y="172" width="54" height="160" rx="27" fill="url(#favBlueGrad)" />

  <!-- Barra base conectora -->
  <rect x="138" y="278" width="236" height="54" rx="27" fill="url(#favBlueGrad)" />

  <!-- Ruedas del carrito -->
  <circle cx="192" cy="405" r="30" fill="url(#favGreenGrad)" />
  <circle cx="320" cy="405" r="30" fill="url(#favGreenGrad)" />
</svg>
